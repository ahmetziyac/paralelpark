<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Park Ustası — Paralel ve L Park Eğitim Oyunu</title>
<meta name="description" content="Park Ustası: paralel ve L parkı, trafik kurallarına uygun öğren. Canlı aynalar, kokpit, gece modu, geri görüş kamerası ve yıldızlı görevler. Kurulum yok — tarayıcıda oyna.">
<meta property="og:title" content="Park Ustası — Paralel ve L Park Eğitim Oyunu">
<meta property="og:description" content="Kokpit, canlı aynalar, gece modu ve gerçekçi kurallarla park eğitimi. Tarayıcıda oyna; telefona uygulama gibi kur.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0d10'/%3E%3Cpath d='M20 46V18h14a10 10 0 0 1 0 20h-8' fill='none' stroke='%237ed321' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M16 54h32' stroke='%23f2f3f5' stroke-width='3' stroke-dasharray='6 5' stroke-linecap='round' opacity='.5'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0b0d10;
    --surface:#12151b;
    --surface-2:#1a1e26;
    --fg:#f2f3f5;
    --muted:#a0a6b0;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.16);
    --accent:#7ed321;
    --accent-ink:#0d1602;
    --success:#43b478;
    --danger:#e5656b;
    --font-display:"Segoe UI Variable Display","Aptos Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-body:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
    --font-mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;
    background:var(--bg);
    color:var(--fg);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent);color:var(--accent-ink)}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--fg);outline-offset:3px;border-radius:4px}
  .skip{
    position:absolute;left:16px;top:-48px;z-index:100;
    background:var(--surface-2);border:1px solid var(--border-strong);
    color:var(--fg);padding:10px 14px;border-radius:8px;text-decoration:none;
    font-size:14px;font-weight:600;transition:top .15s ease;
  }
  .skip:focus{top:12px}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px}
  section{scroll-margin-top:88px}

  /* ---------- header ---------- */
  .nav{
    position:sticky;top:0;z-index:50;
    background:rgba(11,13,16,.78);
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .nav-inner{display:flex;align-items:center;gap:28px;height:60px}
  .brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
  .brand svg{display:block}
  .nav-inner nav{flex:1;min-width:0}
  .nav-links{display:flex;gap:22px;list-style:none;margin:0;padding:0;overflow-x:auto;scrollbar-width:none}
  .nav-links::-webkit-scrollbar{display:none}
  .nav-links a{
    text-decoration:none;color:var(--muted);font-size:14px;font-weight:550;
    letter-spacing:.02em;white-space:nowrap;transition:color .15s ease;
  }
  .nav-links a:hover{color:var(--fg)}

  /* ---------- type ---------- */
  h1,h2,h3{font-family:var(--font-display);margin:0}
  .eyebrow{
    font-family:var(--font-mono);font-size:12px;font-weight:600;
    text-transform:uppercase;letter-spacing:.1em;color:var(--muted);margin:0 0 16px;
  }
  .display{
    font-size:clamp(44px,6vw,66px);font-weight:650;line-height:1.04;
    letter-spacing:-.025em;max-width:12em;
  }
  .display .soft{color:var(--muted)}
  h2.section-title{
    font-size:clamp(26px,3.4vw,32px);font-weight:600;line-height:1.15;
    letter-spacing:-.015em;
  }
  .lede{font-size:17.5px;line-height:1.6;color:var(--muted);max-width:56ch;margin:20px 0 0}
  .meta-row{
    display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:26px;
    font-family:var(--font-mono);font-size:12.5px;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);
  }
  .meta-row span{display:inline-flex;align-items:center;gap:8px}
  .meta-row svg{flex:none}

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex;align-items:center;gap:9px;
    padding:12px 20px;border-radius:10px;border:1px solid transparent;
    font-family:var(--font-body);font-size:15px;font-weight:600;letter-spacing:.02em;
    text-decoration:none;cursor:pointer;transition:transform .15s ease,background .15s ease,border-color .15s ease,color .15s ease;
  }
  .btn:active{transform:translateY(1px)}
  .btn-primary{background:var(--accent);color:var(--accent-ink)}
  .btn-primary:hover{background:#93e336}
  .btn-ghost{background:rgba(255,255,255,.03);border-color:var(--border-strong);color:var(--fg)}
  .btn-ghost:hover{background:rgba(255,255,255,.07)}
  .cta-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}

  /* ---------- hero ---------- */
  .hero{padding:88px 0 84px}
  .hero-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:56px;align-items:center}

  /* ---------- scene card ---------- */
  .scene-card{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:14px 14px 12px;
  }
  .scene-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .chip{
    font-family:var(--font-mono);font-size:11px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);
    border:1px solid var(--border-strong);border-radius:6px;padding:5px 9px;
    display:inline-flex;align-items:center;gap:7px;
  }
  .chip .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .scene{display:block;width:100%;height:auto;border-radius:10px;background:#10131a;border:1px solid var(--border)}
  .scene-note{
    padding:12px 6px 4px;border-top:1px dashed rgba(255,255,255,.12);margin-top:10px;
    font-size:14.5px;color:var(--fg);font-weight:550;line-height:1.5;
  }
  .scene-note b{color:var(--accent)}

  /* ---------- sections ---------- */
  .section{padding:96px 0}
  .section-head{max-width:640px;margin-bottom:48px}
  .section-head .lede{margin-top:14px;font-size:16.5px}

  /* bento */
  .bento{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .tip{
    grid-column:span 2;
    background:var(--surface);border:1px solid var(--border);border-radius:12px;
    padding:22px;transition:background .15s ease,border-color .15s ease;
  }
  .tip:hover{background:var(--surface-2);border-color:var(--border-strong)}
  .tip.wide{grid-column:span 3}
  .tip.full{grid-column:span 6}
  .tip svg{color:var(--muted);display:block;margin-bottom:14px}
  .tip h3{font-size:16.5px;font-weight:600;letter-spacing:-.005em;margin-bottom:8px}
  .tip p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.6}

  /* missions */
  .missions{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .mission{
    background:var(--surface);border:1px solid var(--border);border-radius:14px;
    padding:26px;display:flex;flex-direction:column;gap:14px;
    transition:background .15s ease,border-color .15s ease;
  }
  .mission:hover{background:var(--surface-2);border-color:var(--border-strong)}
  .mission-num{
    font-family:var(--font-mono);font-size:12px;font-weight:600;letter-spacing:.1em;
    color:var(--muted);text-transform:uppercase;
  }
  .mission h3{font-size:20px;font-weight:600;letter-spacing:-.01em}
  .mission p{margin:0;font-size:14.5px;color:var(--muted)}
  .mission ol{margin:0;padding-left:20px;font-size:14px;color:var(--muted);line-height:1.65}
  .mission ol b{color:var(--fg);font-weight:600}
  .mission-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:auto;padding-top:8px}
  .mission-par{font-family:var(--font-mono);font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .mission .btn{padding:9px 16px;font-size:14px}

  /* controls */
  .ctrl-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:56px;align-items:start}
  .ctrl-list{border-top:1px solid var(--border);list-style:none;margin:0;padding:0}
  .ctrl-list li{
    display:flex;align-items:center;gap:18px;justify-content:space-between;
    padding:14px 0;border-bottom:1px solid var(--border);
  }
  .ctrl-list .keys{display:flex;gap:6px;flex:none}
  kbd{
    font-family:var(--font-mono);font-size:12.5px;font-weight:600;letter-spacing:.02em;
    color:var(--fg);background:var(--surface-2);border:1px solid var(--border-strong);
    border-bottom-width:2px;border-radius:7px;padding:4px 9px;min-width:32px;text-align:center;
  }
  .ctrl-list .act{font-size:14.5px;color:var(--muted);text-align:right}
  .ctrl-aside{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px}
  .ctrl-aside h3{font-size:16.5px;font-weight:600;margin-bottom:10px}
  .ctrl-aside p{margin:0;font-size:14.5px;color:var(--muted);line-height:1.65}
  .ctrl-aside .chip{margin-bottom:16px}

  /* faq */
  .faq{max-width:820px;border-top:1px solid var(--border)}
  .faq details{border-bottom:1px solid var(--border)}
  .faq summary{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:20px 0;cursor:pointer;list-style:none;
    font-family:var(--font-display);font-size:16.5px;font-weight:600;letter-spacing:-.005em;
    transition:color .15s ease;
  }
  .faq summary::-webkit-details-marker{display:none}
  .faq summary:hover{color:var(--muted)}
  .faq summary svg{flex:none;color:var(--muted);transition:transform .2s ease}
  .faq details[open] summary svg{transform:rotate(180deg)}
  .faq .answer{padding:0 0 22px;color:var(--muted);font-size:15px;max-width:62ch;line-height:1.65}

  /* cta band */
  .band{
    background:var(--surface);border:1px solid var(--border);border-radius:16px;
    padding:44px 40px;display:flex;align-items:center;justify-content:space-between;
    gap:24px;flex-wrap:wrap;
  }
  .band h2{font-size:clamp(22px,2.6vw,28px);font-weight:600;letter-spacing:-.015em}
  .band p{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:52ch}

  /* footer */
  footer{border-top:1px solid var(--border);padding:36px 0 44px;margin-top:24px}
  .foot{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;justify-content:space-between}
  .foot p{margin:0;font-family:var(--font-mono);font-size:12.5px;letter-spacing:.03em;color:var(--muted)}
  .foot a{color:var(--muted);text-decoration:none;font-size:13.5px;font-weight:550}
  .foot a:hover{color:var(--fg)}

  /* reveal */
  .reveal{opacity:0;transform:translateY(12px)}
  .reveal.in{
    opacity:1;transform:none;
    transition:opacity .6s cubic-bezier(.16,1,.3,1),transform .6s cubic-bezier(.16,1,.3,1);
    transition-delay:calc(var(--i,0)*80ms);
  }

  /* responsive */
  @media (max-width:1020px){
    .hero-grid{grid-template-columns:1fr;gap:44px}
    .ctrl-grid{grid-template-columns:1fr;gap:40px}
  }
  @media (max-width:760px){
    .hero{padding:64px 0 60px}
    .section{padding:72px 0}
    .bento{grid-template-columns:1fr;gap:12px}
    .tip,.tip.wide,.tip.full{grid-column:span 1}
    .missions{grid-template-columns:1fr;gap:12px}
    .band{padding:32px 22px}
    .nav-inner{gap:16px}
    .ctrl-list li{flex-direction:column;align-items:flex-start;gap:8px}
    .ctrl-list .act{text-align:left}
  }
  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    .reveal{opacity:1;transform:none}
    .reveal.in{transition:none}
    .faq summary svg{transition:none}
    .btn,.tip,.mission{transition:none}
  }
</style>
</head>

    </nav>
  </div>
